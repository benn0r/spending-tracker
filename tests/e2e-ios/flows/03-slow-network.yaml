appId: app.spendingtracker.mobile
name: Native iOS slow network recovery
---
- launchApp:
    clearState: true
- tapOn:
    id: server-url-input
- inputText: ${MOCK_URL}/slow
- tapOn:
    id: api-token-input
- inputText: ${API_TOKEN}
- tapOn:
    id: save-connection-button
- tapOn:
    text: Not Now
    optional: true
- extendedWaitUntil:
    visible: Not Now
    timeout: 10000
- tapOn: Not Now
- extendedWaitUntil:
    visible: View details for Moonbeam Market
    timeout: 10000
- tapOn: Add transaction
- tapOn: Enchanted Groceries
- waitForAnimationToEnd
- tapOn:
    id: amount-input
- inputText: '8.40'
- tapOn: Done entering number
- tapOn:
    id: comment-input
- inputText: Queued during slow internet
- pressKey: Enter
- tapOn:
    id: choice-moonlight-wallet
- waitForAnimationToEnd
- tapOn:
    id: choice-moonlight-wallet
- tapOn:
    id: save-transaction-button
- assertVisible: View details for Queued during slow internet
