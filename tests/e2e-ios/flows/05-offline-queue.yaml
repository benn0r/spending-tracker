appId: app.spendingtracker.mobile
name: Native iOS offline startup diagnostics
---
- launchApp:
    clearState: true
- tapOn:
    id: server-url-input
- inputText: ${MOCK_URL}/offline
- tapOn:
    id: api-token-input
- inputText: ${API_TOKEN}
- tapOn:
    id: save-connection-button
- tapOn:
    text: Not Now
    optional: true
- extendedWaitUntil:
    visible: Couldn’t load your budget
    timeout: 20000
- assertVisible: '.*Network request did not receive a response.*'
- tapOn: Retry loading transactions
- assertVisible: Couldn’t load your budget
