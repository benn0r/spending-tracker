name: Build, test, and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: spending-tracker-ci-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  build:
    needs: quality
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SPENDING_TRACKER_API_URL: ${{ vars.EXPO_PUBLIC_SPENDING_TRACKER_API_URL }}
      EXPO_PUBLIC_SPENDING_TRACKER_API_KEY: ${{ vars.EXPO_PUBLIC_SPENDING_TRACKER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run build
      - uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test

  test-e2e:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - uses: christopherhx/gitea-download-artifact@v4
        with:
          name: web-dist
          path: dist
      - run: npm run test:e2e

  publish-image:
    needs: [test, test-e2e]
    if: ${{ gitea.event_name == 'push' && (gitea.ref == 'refs/heads/main' || startsWith(gitea.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: christopherhx/gitea-download-artifact@v4
        with:
          name: web-dist
          path: dist
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.CONTAINER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ vars.CONTAINER_REGISTRY }}/${{ gitea.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
